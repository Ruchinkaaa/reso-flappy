<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Suzy the Flappy Bird</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; -webkit-user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#0a0a12;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }

  .overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff;
    background:rgba(10,10,20,0.35);
    backdrop-filter: blur(2px);
    z-index:5;
  }
  .hidden { display:none !important; }

  .title {
    font-size:clamp(2.2rem, 8vw, 4rem);
    font-weight:900;
    letter-spacing:1px;
    color:#FFD23F;
    text-shadow: 0 4px 0 #E8871E, 0 8px 18px rgba(0,0,0,0.5);
    -webkit-text-stroke: 2px #8B4513;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: clamp(0.9rem, 3vw, 1.15rem);
    color:#fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    margin-bottom: 22px;
    opacity:0.9;
  }
  .bird-preview { width:70px; height:70px; margin-bottom: 18px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)); }

  .btn {
    pointer-events:auto;
    padding: 14px 40px;
    font-size: 1.3rem;
    font-weight:800;
    color:#fff;
    background: linear-gradient(180deg, #6FE86F, #2FBF3F);
    border: 3px solid #1c8a2a;
    border-radius: 50px;
    box-shadow: 0 6px 0 #1c8a2a, 0 10px 20px rgba(0,0,0,0.4);
    cursor:pointer;
    letter-spacing: 1px;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1c8a2a, 0 4px 10px rgba(0,0,0,0.4); }

  .stat-row { display:flex; gap:26px; margin: 14px 0 26px; }
  .stat { display:flex; flex-direction:column; align-items:center; }
  .stat .val { font-size:1.8rem; font-weight:900; color:#FFD23F; text-shadow:0 3px 0 #8B4513; }
  .stat .lbl { font-size:0.75rem; letter-spacing:2px; opacity:0.85; margin-top:2px;}

  .score-hud {
    position:absolute; top:5%; left:50%; transform:translateX(-50%);
    font-size:clamp(2.5rem, 10vw, 4.5rem);
    font-weight:900;
    color:#fff;
    -webkit-text-stroke: 2.5px #4a3000;
    text-shadow: 0 4px 10px rgba(0,0,0,0.35);
    z-index:4;
    pointer-events:none;
    font-variant-numeric: tabular-nums;
  }
  .mute-btn {
    position:absolute; top:4%; right:4%; z-index:6;
    width:46px; height:46px; border-radius:50%;
    background:rgba(0,0,0,0.35); border:2px solid rgba(255,255,255,0.5);
    color:#fff; font-size:1.3rem; display:flex; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="scoreHud" class="score-hud hidden">0</div>
  <button id="muteBtn" class="mute-btn">🔊</button>

  <div id="startScreen" class="overlay">
    <svg class="bird-preview" viewBox="0 0 100 100">
      <ellipse cx="50" cy="55" rx="34" ry="28" fill="#FFD23F"/>
      <ellipse cx="38" cy="60" rx="16" ry="11" fill="#FFA500"/>
      <circle cx="66" cy="42" r="7" fill="#fff"/>
      <circle cx="68" cy="42" r="3.5" fill="#222"/>
      <path d="M78 50 L96 44 L80 58 Z" fill="#FF8C00"/>
      <path d="M28 24 Q14 16 10 24 Q14 32 28 24 Z" fill="#FF6FA5"/>
      <path d="M28 24 Q42 16 46 24 Q42 32 28 24 Z" fill="#FF6FA5"/>
      <ellipse cx="28" cy="24" rx="5" ry="4.2" fill="#E8508C"/>
    </svg>
    <div class="title">SUZY</div>
    <div class="subtitle">Help Suzy flap through the pipes!</div>
    <div class="stat-row"><div class="stat"><div class="val" id="bestStart">0</div><div class="lbl">BEST</div></div></div>
    <button class="btn" id="startBtn">▶ TAP TO START</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <div class="title" style="font-size:clamp(1.8rem,7vw,3rem)">GAME OVER</div>
    <div class="stat-row">
      <div class="stat"><div class="val" id="finalScore">0</div><div class="lbl">SCORE</div></div>
      <div class="stat"><div class="val" id="bestScore">0</div><div class="lbl">BEST</div></div>
    </div>
    <button class="btn" id="retryBtn">↻ PLAY AGAIN</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreHud = document.getElementById('scoreHud');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const muteBtn = document.getElementById('muteBtn');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const bestStartEl = document.getElementById('bestStart');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Sound (synthesized, no audio files needed) ----------
  let actx = null;
  let muted = false;
  let ambientGain = null;
  let ambientNodes = [];
  function ensureAudio(){
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    if (actx) startAmbient();
  }
  // soft, low ambient background pad — synthesized, loops forever, no file needed
  function startAmbient(){
    if (!actx || ambientNodes.length) return;
    ambientGain = actx.createGain();
    ambientGain.gain.value = muted ? 0 : 0.05;
    ambientGain.connect(actx.destination);

    const freqs = [110, 164.81, 220]; // low A2 / E3 / A3 pad chord
    freqs.forEach((f,i)=>{
      const osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = actx.createGain();
      g.gain.value = 0.55/(i+1);
      osc.connect(g).connect(ambientGain);
      osc.start();
      ambientNodes.push(osc);
    });
    // slow gentle "breathing" swell so the pad doesn't feel static
    const lfo = actx.createOscillator();
    lfo.frequency.value = 0.12;
    const lfoGain = actx.createGain();
    lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain).connect(ambientGain.gain);
    lfo.start();
    ambientNodes.push(lfo);
  }
  function tone(freq, dur, type, startGain, opts){
    if (muted || !actx) return;
    opts = opts || {};
    const t0 = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (opts.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(opts.slideTo,1), t0+dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(startGain || 0.25, t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function noiseBurst(dur, startGain){
    if (muted || !actx) return;
    const t0 = actx.currentTime;
    const bufferSize = actx.sampleRate * dur;
    const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const src = actx.createBufferSource();
    src.buffer = buffer;
    const gain = actx.createGain();
    gain.gain.setValueAtTime(startGain||0.3, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    const filter = actx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 900;
    src.connect(filter).connect(gain).connect(actx.destination);
    src.start(t0);
  }
  const sfx = {
    flap(){ ensureAudio(); tone(520, 0.11, 'square', 0.18, {slideTo:760}); },
    score(){ ensureAudio(); tone(880, 0.09, 'triangle', 0.22); setTimeout(()=>tone(1180,0.14,'triangle',0.22),70); },
    hit(){ ensureAudio(); tone(140, 0.35, 'sawtooth', 0.28, {slideTo:40}); noiseBurst(0.28, 0.35); },
    swoosh(){ ensureAudio(); noiseBurst(0.18, 0.12); }
  };
  muteBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (ambientGain) ambientGain.gain.value = muted ? 0 : 0.05;
  });

  // ---------- Persistent best score ----------
  let best = 0;
  async function loadBest(){
    try {
      const r = await window.storage.get('flappy-best', false);
      if (r && r.value) best = parseInt(r.value,10) || 0;
    } catch(e){ best = 0; }
    bestStartEl.textContent = best;
    bestScoreEl.textContent = best;
  }
  async function saveBest(){
    try { await window.storage.set('flappy-best', String(best), false); } catch(e){}
  }
  loadBest();

  // ---------- Game constants ----------
  const GROUND_H_RATIO = 0.14;
  const GRAVITY = 2000;
  const FLAP_VELOCITY = -620;
  const PIPE_GAP_RATIO = 0.27;
  const PIPE_W_RATIO = 0.16;
  const PIPE_SPACING_RATIO = 0.62;
  const SCROLL_SPEED = 200;

  let state = 'start'; // start | play | dead
  let birdY, birdV, birdRot, wingPhase;
  let pipes = [];
  let particles = [];
  let feathers = [];
  let score = 0;
  let groundX = 0;
  let cloudX = 0, mountainX = 0;
  let shake = 0;
  let flashAlpha = 0;
  let lastTime = 0;
  let clouds = [];
  let stars = [];

  function birdX(){ return W*0.28; }
  function birdSize(){ return Math.max(34, Math.min(W,H)*0.075); }
  function groundH(){ return H*GROUND_H_RATIO; }
  function pipeW(){ return W*PIPE_W_RATIO; }
  function pipeGap(){ return H*PIPE_GAP_RATIO; }
  function pipeSpacing(){ return W*PIPE_SPACING_RATIO; }

  function initClouds(){
    clouds = [];
    for (let i=0;i<6;i++){
      clouds.push({ x: Math.random()*W, y: Math.random()*H*0.5, s: 0.5+Math.random()*1.1, speed: 0.25+Math.random()*0.25 });
    }
  }

  function resetGame(){
    birdY = H*0.42; birdV = 0; birdRot = 0; wingPhase = 0;
    pipes = []; particles = []; feathers = [];
    score = 0; shake = 0; flashAlpha = 0;
    scoreHud.textContent = '0';
    const firstX = W + 40;
    for (let i=0;i<4;i++){
      pipes.push(makePipe(firstX + i*pipeSpacing()));
    }
    initClouds();
  }

  function makePipe(x){
    const gap = pipeGap();
    const gH = groundH();
    const margin = H*0.12;
    const minTop = margin;
    const maxTop = H - gH - margin - gap;
    const topH = minTop + Math.random()*(maxTop-minTop);
    return { x, topH, gap, passed:false };
  }

  function spawnFeathers(x,y,count,hue){
    for (let i=0;i<count;i++){
      feathers.push({
        x, y,
        vx: (Math.random()-0.5)*260,
        vy: -Math.random()*260 - 40,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*10,
        life: 1,
        size: 6+Math.random()*8,
        hue: hue || (30+Math.random()*30)
      });
    }
  }

  function flap(){
    if (state === 'start'){ startGame(); return; }
    if (state === 'dead') return;
    ensureAudio();
    birdV = FLAP_VELOCITY;
    sfx.flap();
    spawnFeathers(birdX()-10, birdY+10, 3, 45);
  }

  function startGame(){
    ensureAudio();
    state = 'play';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    scoreHud.classList.remove('hidden');
    resetGame();
    birdV = FLAP_VELOCITY;
    sfx.flap();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  async function die(){
    if (state !== 'play') return;
    state = 'dead';
    shake = 18;
    flashAlpha = 0.55;
    sfx.hit();
    spawnFeathers(birdX(), birdY, 16);
    if (score > best){ best = score; await saveBest(); }
    setTimeout(()=>{
      finalScoreEl.textContent = score;
      bestScoreEl.textContent = best;
      overScreen.classList.remove('hidden');
    }, 650);
  }

  function restart(){
    overScreen.classList.add('hidden');
    scoreHud.classList.remove('hidden');
    state = 'play';
    resetGame();
    birdV = FLAP_VELOCITY;
    sfx.swoosh();
  }

  startBtn.addEventListener('click', (e)=>{ e.stopPropagation(); startGame(); });
  retryBtn.addEventListener('click', (e)=>{ e.stopPropagation(); restart(); });

  function onTap(e){
    if (e.target === muteBtn) return;
    if (e.target === startBtn || e.target === retryBtn) return;
    flap();
  }
  window.addEventListener('pointerdown', onTap, {passive:true});
  window.addEventListener('keydown', (e)=>{
    if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); flap(); }
  });

  // ---------- Update ----------
  function update(dt){
    if (state === 'play'){
      birdV += GRAVITY*dt;
      birdY += birdV*dt;
      birdRot = Math.max(-0.5, Math.min(1.3, birdV/700));

      for (const p of pipes){
        p.x -= SCROLL_SPEED*dt;
        if (!p.passed && p.x + pipeW() < birdX()-birdSize()*0.3){
          p.passed = true;
          score++;
          scoreHud.textContent = score;
          scoreHud.style.transform = 'translateX(-50%) scale(1.25)';
          setTimeout(()=>{ scoreHud.style.transform = 'translateX(-50%) scale(1)'; },140);
          sfx.score();
        }
      }
      if (pipes.length && pipes[0].x + pipeW() < -20){
        pipes.shift();
        const lastX = pipes[pipes.length-1].x;
        pipes.push(makePipe(lastX + pipeSpacing()));
      }

      // collisions
      const bx = birdX(), by = birdY, r = birdSize()*0.42;
      const gH = groundH();
      if (by + r > H - gH){ by_die(); }
      if (by - r < 0){ birdY = r; birdV = 0; }
      for (const p of pipes){
        if (bx + r > p.x && bx - r < p.x + pipeW()){
          if (by - r < p.topH || by + r > p.topH + p.gap){ by_die(); break; }
        }
      }
      function by_die(){ die(); }

      wingPhase += dt*(10 + Math.min(8, Math.abs(birdV)/120));
    } else {
      wingPhase += dt*4;
    }

    groundX -= SCROLL_SPEED*dt*(state==='dead'?0:1);
    cloudX -= dt;
    for (const c of clouds){ c.x -= c.speed*40*dt; if (c.x < -120){ c.x = W+60; c.y = Math.random()*H*0.5; } }

    for (const f of feathers){
      f.vy += 700*dt;
      f.x += f.vx*dt; f.y += f.vy*dt;
      f.rot += f.vr*dt;
      f.life -= dt*0.9;
    }
    feathers = feathers.filter(f=>f.life>0);

    if (shake>0) shake = Math.max(0, shake - dt*40);
    if (flashAlpha>0) flashAlpha = Math.max(0, flashAlpha - dt*1.2);
  }

  // ---------- Draw ----------
  function draw(){
    ctx.save();
    if (shake>0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // sky
    const skyGrad = ctx.createLinearGradient(0,0,0,H);
    skyGrad.addColorStop(0, '#6EC6FF');
    skyGrad.addColorStop(0.55, '#8FD8FF');
    skyGrad.addColorStop(0.75, '#FFD98A');
    skyGrad.addColorStop(1, '#FFB35C');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,W,H);

    // sun
    ctx.save();
    const sunX = W*0.78, sunY = H*0.2, sunR = Math.min(W,H)*0.09;
    const sunGrad = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*2.2);
    sunGrad.addColorStop(0,'rgba(255,244,200,0.9)');
    sunGrad.addColorStop(1,'rgba(255,244,200,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath(); ctx.arc(sunX,sunY,sunR*2.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFF4C8';
    ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds){ drawCloud(c.x, c.y, c.s); }

    // distant mountains
    ctx.fillStyle = 'rgba(150,110,190,0.35)';
    drawMountains(H*0.62, 140, 40);
    ctx.fillStyle = 'rgba(120,80,170,0.35)';
    drawMountains(H*0.68, 100, 90);

    // pipes
    for (const p of pipes) drawPipe(p);

    // feathers
    for (const f of feathers){
      ctx.save();
      ctx.globalAlpha = Math.max(0,f.life);
      ctx.translate(f.x,f.y); ctx.rotate(f.rot);
      ctx.fillStyle = `hsl(${f.hue},90%,60%)`;
      ctx.beginPath();
      ctx.ellipse(0,0,f.size,f.size*0.5,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    // ground
    drawGround();

    // bird
    if (state !== 'start') drawBird();

    // flash on death
    if (flashAlpha>0){
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0,0,W,H);
    }

    ctx.restore();
  }

  function drawCloud(x,y,s){
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
    ctx.beginPath();
    ctx.arc(0,0,22,0,Math.PI*2);
    ctx.arc(24,-10,26,0,Math.PI*2);
    ctx.arc(50,0,20,0,Math.PI*2);
    ctx.arc(22,10,24,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawMountains(baseY, amp, seedOffset){
    ctx.beginPath();
    ctx.moveTo(0,H);
    const step = W/6;
    for (let i=0;i<=6;i++){
      const x = i*step;
      const y = baseY - Math.abs(Math.sin((i+seedOffset)*1.3))*amp;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);
    ctx.closePath();
    ctx.fill();
  }

  function drawPipe(p){
    const w = pipeW();
    const capH = w*0.28;
    const gH = groundH();
    const grad = ctx.createLinearGradient(p.x,0,p.x+w,0);
    grad.addColorStop(0,'#3FB84F');
    grad.addColorStop(0.45,'#6FE86F');
    grad.addColorStop(0.55,'#4FCF5A');
    grad.addColorStop(1,'#2E9A3C');

    // top pipe
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, 0, w, p.topH - capH);
    ctx.fillRect(p.x - w*0.06, p.topH - capH, w*1.12, capH);
    ctx.strokeStyle = 'rgba(0,60,10,0.35)'; ctx.lineWidth = 3;
    ctx.strokeRect(p.x, 0, w, p.topH - capH);
    ctx.strokeRect(p.x - w*0.06, p.topH - capH, w*1.12, capH);

    // bottom pipe
    const bottomY = p.topH + p.gap;
    const bottomH = H - gH - bottomY;
    ctx.fillStyle = grad;
    ctx.fillRect(p.x, bottomY + capH, w, bottomH - capH);
    ctx.fillRect(p.x - w*0.06, bottomY, w*1.12, capH);
    ctx.strokeRect(p.x, bottomY + capH, w, bottomH - capH);
    ctx.strokeRect(p.x - w*0.06, bottomY, w*1.12, capH);

    // highlight stripe
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(p.x + w*0.15, 0, w*0.12, p.topH - capH);
    ctx.fillRect(p.x + w*0.15, bottomY + capH, w*0.12, bottomH - capH);
  }

  function drawGround(){
    const gH = groundH();
    const y = H - gH;
    const grad = ctx.createLinearGradient(0,y,0,H);
    grad.addColorStop(0,'#DEB877');
    grad.addColorStop(0.15,'#C99A56');
    grad.addColorStop(1,'#A87B3E');
    ctx.fillStyle = grad;
    ctx.fillRect(0,y,W,gH);

    // grass strip
    ctx.fillStyle = '#6FE86F';
    ctx.fillRect(0,y,W,gH*0.16);
    ctx.fillStyle = '#4FCF5A';
    const tuftW = 22;
    let gx = -(groundX % tuftW);
    for (; gx < W; gx += tuftW){
      ctx.beginPath();
      ctx.moveTo(gx, y+gH*0.16);
      ctx.lineTo(gx+tuftW*0.5, y);
      ctx.lineTo(gx+tuftW, y+gH*0.16);
      ctx.fill();
    }
    // texture dashes
    ctx.strokeStyle = 'rgba(0,0,0,0.12)';
    ctx.lineWidth = 3;
    let dx = -(groundX*1.4 % 40);
    for (; dx < W; dx += 40){
      ctx.beginPath();
      ctx.moveTo(dx, y+gH*0.45);
      ctx.lineTo(dx+18, y+gH*0.45);
      ctx.stroke();
    }
  }

  function drawBird(){
    const bx = birdX(), by = birdY;
    const size = birdSize();
    ctx.save();
    ctx.translate(bx,by);
    ctx.rotate(birdRot*0.9);

    // body
    const bodyGrad = ctx.createRadialGradient(-size*0.2,-size*0.2,size*0.1, 0,0,size);
    bodyGrad.addColorStop(0,'#FFEB7A');
    bodyGrad.addColorStop(0.6,'#FFD23F');
    bodyGrad.addColorStop(1,'#F5A623');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0,0,size,size*0.8,0,0,Math.PI*2);
    ctx.fill();

    // belly
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-size*0.15,size*0.28,size*0.55,size*0.4,0,0,Math.PI*2);
    ctx.fill();

    // tail
    ctx.fillStyle = '#FF8C00';
    ctx.beginPath();
    ctx.moveTo(-size*0.85,-size*0.1);
    ctx.lineTo(-size*1.35,-size*0.32);
    ctx.lineTo(-size*1.3,size*0.12);
    ctx.closePath();
    ctx.fill();

    // wing
    const flapOffset = Math.sin(wingPhase)*0.9;
    ctx.save();
    ctx.translate(-size*0.05, size*0.05);
    ctx.rotate(flapOffset*0.7);
    const wingGrad = ctx.createLinearGradient(0,-size*0.4,0,size*0.4);
    wingGrad.addColorStop(0,'#FFA726');
    wingGrad.addColorStop(1,'#F57C00');
    ctx.fillStyle = wingGrad;
    ctx.beginPath();
    ctx.ellipse(0,0,size*0.5,size*0.32,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(size*0.42,-size*0.28,size*0.24,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2A2A2A';
    ctx.beginPath(); ctx.arc(size*0.5,-size*0.28,size*0.12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(size*0.53,-size*0.32,size*0.04,0,Math.PI*2); ctx.fill();

    // beak
    ctx.fillStyle = '#FF7A1A';
    ctx.beginPath();
    ctx.moveTo(size*0.78,-size*0.06);
    ctx.lineTo(size*1.25,size*0.02);
    ctx.lineTo(size*0.78,size*0.24);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth=2; ctx.stroke();

    // cheek blush
    ctx.fillStyle = 'rgba(255,120,120,0.35)';
    ctx.beginPath(); ctx.ellipse(size*0.05,size*0.05,size*0.16,size*0.1,0,0,Math.PI*2); ctx.fill();

    // pookie bow on top of the head, loops on both sides
    drawBow(-size*0.08, -size*0.98, size*0.34);

    ctx.restore();
  }

  function drawBow(x, y, s){
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#FF6FA5';
    ctx.strokeStyle = '#D9427E';
    ctx.lineWidth = Math.max(1.5, s*0.08);

    // left loop
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-s*1.5,-s*1.05,-s*1.65,0);
    ctx.quadraticCurveTo(-s*1.5,s*1.05,0,0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // right loop
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(s*1.5,-s*1.05,s*1.65,0);
    ctx.quadraticCurveTo(s*1.5,s*1.05,0,0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // little loop highlights
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-s*0.75,-s*0.25,s*0.35,s*0.18,0.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.75,-s*0.25,s*0.35,s*0.18,-0.5,0,Math.PI*2); ctx.fill();

    // center knot
    ctx.fillStyle = '#E8508C';
    ctx.beginPath();
    ctx.ellipse(0,0,s*0.5,s*0.4,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#B8305F'; ctx.lineWidth = Math.max(1,s*0.06);
    ctx.stroke();

    ctx.restore();
  }

  // ---------- Loop ----------
  function loop(now){
    const dt = Math.min(0.033, (now - lastTime)/1000);
    lastTime = now;
    if (state === 'play') update(dt);
    else if (state === 'dead') update(dt*0.4);
    else update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // idle preview animation before start
  function idleLoop(now){
    if (state !== 'start'){ return; }
    const dt = Math.min(0.033, (now-(lastTime||now))/1000);
    lastTime = now;
    for (const c of clouds){ c.x -= c.speed*40*dt; if (c.x < -120){ c.x = W+60; c.y = Math.random()*H*0.5; } }
    groundX -= SCROLL_SPEED*0.5*dt;
    draw();
    requestAnimationFrame(idleLoop);
  }

  // init idle background
  birdY = H*0.42; birdV=0; birdRot=0; wingPhase=0;
  pipes = []; feathers = [];
  initClouds();
  lastTime = performance.now();
  requestAnimationFrame(idleLoop);

})();
</script>
</body>
